seo:
  title: Aanbod en prijs | {brand_name} | Voetbalfotografie
  description: Bekijk wat je ontvangt bij een wedstrijdreportage of spelersshoot.
header:
  label: Aanbod
  title: Betaalbare sportfotografie
  intro: Voor clubs en individuele spelers. De prijs hangt af van de opdracht en is bespreekbaar.
overview:
  image:
    src: /assets/img/site/aanbod.webp
    alt: Speler trapt de bal vanaf de hoekschopstip tijdens een voetbalwedstrijd in Antwerpen
  items:
    - Een volledige wedstrijdreportage voor een club of gerichte foto's van één speler
    - Zorgvuldig bewerkt in mijn vaste stijl
    - Digitale levering in volledige resolutie
    - Uiterlijk {delivery_days} dagen na de wedstrijd of shoot
    - Actie, spelers, sfeer en wedstrijdmomenten
    - Geschikt voor sociale media, websites en persoonlijke sportprofielen
  button_label: Vraag een voorstel
faq:
  label: Praktisch
  items:
    - title: Wat kost het?
      text: Ik houd mijn tarieven betaalbaar. De prijs hangt af van de opdracht en is bespreekbaar. Daarom staan er geen vaste bedragen op de website.
    - title: Hoe vraag ik een prijsvoorstel aan?
      text: Stuur een mail naar {email} of een bericht via Instagram {instagram_handle}. Vermeld om welke wedstrijdreportage of spelersshoot het gaat.
    - title: Wanneer betaal ik?
      text: "We spreken de betaling vooraf af: je betaalt een voorschot bij het vastleggen van de opdracht en het saldo na de levering."
    - title: Hoeveel foto's krijg je?
      text: Bij een volledige wedstrijdreportage ontvangt de club minimaal {photo_minimum} en meestal {photo_range} bewerkte foto's. Voor een spelersshoot spreken we het aantal vooraf af.
    - title: Wanneer ontvang ik de foto's?
      text: Uiterlijk {delivery_days} dagen na de wedstrijd of shoot.
    - title: Voor wie is dit?
      text: Voor clubs, teams en individuele spelers van elke leeftijdscategorie en elk niveau, van jeugd tot eerste ploeg.
    - title: Wat gebeurt er bij afgelasting?
      text: Als de wedstrijd wordt afgelast of verplaatst, zoeken we samen een nieuwe datum.
agreements:
  title: Afspraken vooraf
  text: Vóór elke opdracht leggen we de wedstrijd of spelersshoot, de prijs, de betaling, de levering en het gebruik van de foto's schriftelijk vast.
  link_label: Bekijk de afspraken
cta:
  label: Contact
  title: Een wedstrijdreportage of spelersshoot boeken?
  text: Vul het formulier in met de datum en de locatie. Ik neem zo snel mogelijk contact op met een voorstel op maat.
  primary_label: Vraag een voorstel
  secondary_label: Bekijk het aanbod
  image:
    src: /assets/img/site/band-cta.webp
    alt: Twee spelers in duel om de bal tijdens een voetbalwedstrijd in Antwerpen
