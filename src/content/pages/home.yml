intro:
  label: Sideline Action
  title: Voetbalfotografie voor clubs én individuele spelers.
  lead: Boek een volledige wedstrijdreportage voor je club of laat één speler tijdens een wedstrijd volgen.
  text: Ik leg actie, duels, emoties en sfeer vast. Daarna selecteer en bewerk ik de beste foto's voor sociale media, websites en sportprofielen.
  link_label: Over mij
  images:
    - src: /assets/img/site/intro-1.webp
      alt: Duel om de bal tussen twee spelers tijdens een voetbalwedstrijd in Antwerpen
    - src: /assets/img/site/intro-2.webp
      alt: Speler voor het doel tijdens een voetbalwedstrijd in Antwerpen
featured:
  label: Portfolio
  shoot: src/content/shoots/ternesse.md
  text: Ik fotografeer de wedstrijd van de opwarming tot het laatste fluitsignaal en lever een ruime selectie zorgvuldig bewerkte foto's.
  link_label: Bekijk de shoot
  portfolio_label: Volledig portfolio
  caption: Duel om de bal, tweede helft.
  images:
    - ../../assets/portfolio/ternesse-002.webp
    - ../../assets/portfolio/ternesse-004.webp
    - ../../assets/portfolio/ternesse-003.webp
band_image:
  src: /assets/img/site/band-1.webp
  alt: Het team verzamelt rond de coach tijdens een voetbalwedstrijd in Antwerpen
services:
  label: Diensten
  title: Twee manieren om te boeken.
  text: Clubs krijgen een volledige wedstrijdreportage. Spelers kunnen mij boeken om hen tijdens een wedstrijd te volgen.
  link_label: Alle diensten
  items:
    - title: Voor clubs
      text: Een volledige wedstrijdreportage met actie, spelers, supporters en sfeer voor sociale media, de clubwebsite en andere communicatie.
    - title: Voor spelers
      text: Actiefoto's van één speler tijdens een wedstrijd, geschikt voor sociale media en een persoonlijk sportprofiel.
    - title: Actie en sfeer
      text: Duels, sprints, schoten, emoties en momenten langs de lijn die de wedstrijd compleet in beeld brengen.
    - title: Selectie en levering
      text: Ik selecteer en bewerk de beste foto's in een vaste, herkenbare stijl.
about:
  label: Over mij
  title: Ik ben {photographer_name}.
  lead: Ik ben {photographer_age} jaar en neem sportfotografie serieus.
  text: Ik fotografeer voetbalwedstrijden in {region}. Ik leg actie, spelers, supporters en sfeer vast en selecteer na afloop de beste foto's.
  link_label: Mijn verhaal en apparatuur
  image:
    src: /assets/img/site/over-mij.webp
    alt: Speler aan de bal tijdens een voetbalwedstrijd in Antwerpen
facts:
  label: Bij een volledige wedstrijdreportage
  items:
    - value: "{photo_range}"
      label: Bewerkte foto's per wedstrijd. Minimaal {photo_minimum}.
    - value: "{delivery_days}"
      label: Maximale levertijd na de wedstrijd.
    - value: "{delivery_format}"
      label: Geleverd in volledige resolutie, meteen bruikbaar voor de clubkanalen.
offer:
  label: Aanbod
  title: Betaalbare sportfotografie op maat van de opdracht.
  text: Ik houd mijn tarieven betaalbaar. De prijs hangt af van de opdracht en is bespreekbaar. Wil je weten wat jouw wedstrijdreportage of spelersshoot kost?
  email_label: Stuur een mailtje
  instagram_label: Instagram
  link_label: Wat is inbegrepen
booking:
  label: Boeken
  title: Klaar voor beelden van je club of van één speler?
  text: Vertel om welke wedstrijdreportage of spelersshoot het gaat. Ik neem zo snel mogelijk contact op met een voorstel en duidelijke afspraken.
  primary_label: Boek een shoot
  secondary_label: Bekijk het aanbod
  image:
    src: /assets/img/site/band-cta.webp
