seo:
  title: "{brand_name} | Voetbalfotografie voor clubs en spelers"
  description: Professionele, betaalbare voetbalbeelden voor clubs en individuele spelers in {region}.
  image: /assets/img/site/hero.webp
hero:
  eyebrow: Voetbalfotografie — voor clubs en spelers
  title_lines:
    - Sideline
    - Action
  subtitle: Professionele voetbalbeelden voor volledige clubs én individuele spelers.
  primary_label: Bekijk portfolio
  secondary_label: Boek een shoot
  meta: "{photographer_name} — Antwerpen"
  image:
    src: /assets/img/site/hero.webp
    alt: Voetballer in een geel shirt dribbelt met de bal — foto door {photographer_name} voor {brand_name}
intro:
  label: Sideline Action
  title: Voetbalfotografie voor clubs én individuele spelers.
  lead: Boek een volledige wedstrijdreportage voor je club, of laat één speler gericht volgen tijdens een wedstrijd.
  text: Ik leg actie, duels, emoties en sfeer vast. Daarna selecteer en bewerk ik de sterkste beelden voor social media, websites en persoonlijke profielen.
  link_label: Over mij
  images:
    - src: /assets/img/site/intro-1.webp
      alt: Duel om de bal tussen twee spelers tijdens een voetbalwedstrijd in Antwerpen
    - src: /assets/img/site/intro-2.webp
      alt: Speler voor het doel tijdens een voetbalwedstrijd — {brand_name}
featured:
  label: Portfolio
  shoot: src/content/shoots/ternesse.md
  text: Een volledige wedstrijd, van de opwarming tot het laatste fluitsignaal. Een uitgebreide selectie beelden, geselecteerd en afgewerkt.
  link_label: Bekijk de shoot
  portfolio_label: Volledig portfolio
  caption: Duel om de bal, tweede helft.
  images:
    - ../../assets/portfolio/ternesse-002.webp
    - ../../assets/portfolio/ternesse-004.webp
    - ../../assets/portfolio/ternesse-003.webp
band_image:
  src: /assets/img/site/band-1.webp
  alt: Het team verzamelt rond de coach tijdens een voetbalwedstrijd in Antwerpen
services:
  label: Diensten
  title: Twee manieren om te boeken.
  text: "Of je nu namens een club boekt of als individuele speler: de fotografie blijft gericht op echte wedstrijdmomenten en een sterke, professionele selectie."
  link_label: Alle diensten
  items:
    - title: Voor clubs
      text: Volledige wedstrijdfotografie met actie, spelers, teams, fans en sfeer voor sociale media, website en communicatie.
    - title: Voor spelers
      text: Persoonlijke actiefoto's van één speler tijdens een wedstrijd, bruikbaar voor Instagram, social media en een eigen sportprofiel.
    - title: Actie en sfeer
      text: Duels, sprints, schoten, emoties en de momenten langs de lijn die het verhaal compleet maken.
    - title: Professionele levering
      text: Een zorgvuldig geselecteerde en professioneel bewerkte reeks, zonder zware extra filters.
about:
  label: Over mij
  title: Ik ben {photographer_name}.
  lead: "{photographer_age} jaar oud, en serieus bezig met sportfotografie."
  text: Ik fotografeer vooral voetbalwedstrijden in {region}. Tijdens wedstrijden probeer ik zoveel mogelijk actie, spelers, fans en sfeer vast te leggen, en daaruit lever ik een sterke selectie goede beelden.
  link_label: Mijn verhaal en apparatuur
  image:
    src: /assets/img/site/over-mij.webp
    alt: Speler aan de bal tijdens een voetbalwedstrijd in Antwerpen — {brand_name}
facts:
  label: Bij een volledige wedstrijd
  items:
    - value: "{photo_range}"
      label: Professioneel bewerkte foto's per wedstrijd. Minimaal {photo_minimum}.
    - value: "{delivery_days}"
      label: Dagen maximaal tussen de wedstrijd en de levering.
    - value: "{delivery_format}"
      label: Geleverd in volledige resolutie, meteen bruikbaar voor de clubkanalen.
offer:
  label: Aanbod
  title: Betaalbare sportfotografie, op maat van de opdracht.
  text: Mijn tarieven liggen bewust lager dan bij veel professionele sportfotografen. Prijzen zijn bespreekbaar en afhankelijk van de opdracht. Benieuwd naar de prijs voor jouw wedstrijd of spelersshoot?
  email_label: Stuur een mailtje
  instagram_label: Instagram
  link_label: Wat is inbegrepen
booking:
  label: Boeken
  title: Klaar voor beelden van je club of van één speler?
  text: Vertel kort om welke wedstrijd of opdracht het gaat. Ik neem zo snel mogelijk contact op met een voorstel en de afspraken.
  primary_label: Boek een shoot
  secondary_label: Bekijk het aanbod
  image:
    src: /assets/img/site/band-cta.webp
    alt: Twee spelers in duel om de bal tijdens een voetbalwedstrijd in Antwerpen — {brand_name}
contact:
  label: Contact
  title_lines:
    - Een vraag?
    - Stuur gerust een bericht.
