seo:
  title: Diensten | Voetbalfotografie voor clubs en spelers | {brand_name}
  description: Wedstrijdreportages voor clubs en actiefoto's van individuele spelers in {region}.
header:
  label: Diensten
  title: Diensten
  intro: Wedstrijdreportages voor clubs en actiefoto's van individuele spelers.
audiences:
  - title: Voor clubs
    text: Ik fotografeer de volledige wedstrijd, van actie op het veld tot de sfeer langs de lijn. De foto's zijn geschikt voor sociale media, de clubwebsite en andere communicatie.
    link_label: Bespreek een wedstrijd
  - title: Voor spelers
    text: Je kunt ook zonder club boeken. Ik volg één speler tijdens een wedstrijd en lever actiefoto's voor sociale media en een persoonlijk sportprofiel.
    link_label: Bespreek een spelersshoot
gallery:
  label: In beeld
  title: Wat ik vastleg
  intro: Ik leg zowel het verloop van de wedstrijd als individuele spelers in actie vast.
  items:
    - title: Actie
      summary: Duels en beslissende acties op het veld.
      text: Ik leg duels, sprints, schoten en reddingen vast.
      image:
        src: /assets/img/site/dienst-actie.webp
        alt: Speler haalt uit naar de bal tijdens een voetbalwedstrijd in Antwerpen
    - title: Spelers
      summary: Individuele spelers en teammomenten.
      text: Herkenbare foto's van individuele spelers en momenten waarop het team samenkomt.
      image:
        src: /assets/img/site/dienst-spelers.webp
        alt: Portret van een jeugdspeler tijdens een voetbalwedstrijd in Antwerpen
    - title: Sfeer
      summary: Supporters, emoties en de sfeer rond de wedstrijd.
      text: Wat er langs de lijn gebeurt, hoort net zo goed bij de wedstrijd als de actie op het veld.
      image:
        src: /assets/img/site/dienst-sfeer.webp
        alt: Spelers vieren een moment tijdens een voetbalwedstrijd in Antwerpen
    - title: Wedstrijdmomenten
      summary: Belangrijke momenten tijdens de wedstrijd.
      text: Ik fotografeer de aftrap, de bespreking van de coach, doelpunten en de reacties erna.
      image:
        src: /assets/img/site/dienst-momenten.webp
        alt: Het team verzamelt tijdens een voetbalwedstrijd in Antwerpen
process:
  label: Mijn aanpak
  title: Van aftrap tot levering
  intro: Tijdens iedere wedstrijd leg ik actie op het veld en sfeer langs de zijlijn vast. Daarna selecteer en bewerk ik de beste foto's.
  steps:
    - title: Afspraak vooraf
      text: We bespreken de wedstrijd en leggen de afspraken kort op papier. Zo zijn ze voor iedereen duidelijk.
    - title: Tijdens de wedstrijd
      text: Ik sta langs de lijn en fotografeer de hele wedstrijd, met aandacht voor actie, spelers en sfeer.
    - title: Selectie en bewerking
      text: Na de wedstrijd bekijk ik alle foto's, selecteer ik de beste en bewerk ik ze in mijn vaste stijl.
    - title: Levering binnen {delivery_days} dagen
      text: Bij een volledige wedstrijdreportage ontvangt de club {photo_range} bewerkte foto's in volledige resolutie. Bij een spelersshoot spreken we de selectie vooraf af.
facts:
  label: Bij een volledige wedstrijdreportage
  items:
    - value: "{photo_range}"
      label: Bewerkte foto's per wedstrijd. Minimaal {photo_minimum}.
    - value: "{delivery_days}"
      label: Maximale levertijd na de wedstrijd.
    - value: "{delivery_format}"
      label: Geleverd in volledige resolutie, meteen bruikbaar voor de clubkanalen.
cta:
  label: Boeken
  title: Laat je wedstrijd of speler fotograferen
  text: Vul het formulier in met de datum en locatie. Ik neem zo snel mogelijk contact op.
  primary_label: Boek een shoot
  secondary_label: Bekijk het aanbod
  image:
    src: /assets/img/site/band-cta.webp
    alt: Twee spelers in duel om de bal tijdens een voetbalwedstrijd in Antwerpen
