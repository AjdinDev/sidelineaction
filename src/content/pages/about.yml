seo:
  title: Over mij | {photographer_name} — {brand_name}
  description: Maak kennis met {photographer_name}, sportfotograaf achter {brand_name}.
header:
  label: Over mij
  title: Over mij
  intro: Ik ben {photographer_name}, {photographer_age} jaar oud, en ik ben serieus bezig met sportfotografie.
story:
  label: Mijn verhaal
  paragraphs:
    - Ik fotografeer voetbalwedstrijden voor clubs en individuele spelers in {region}.
    - Tijdens wedstrijden probeer ik zoveel mogelijk actie, spelers, fans en sfeer vast te leggen. Ik maak zoveel mogelijk foto's en lever daaruit een sterke selectie goede beelden.
    - Ik ben {photographer_age}, en ik pak dit serieus aan. Afspraken worden vooraf vastgelegd, de levering gebeurt binnen maximaal {delivery_days} dagen en iedere opdrachtgever krijgt dezelfde aandacht en kwaliteit.
  link_label: Bekijk mijn werk
  image:
    src: /assets/img/site/over-mij.webp
    alt: Speler aan de bal tijdens een voetbalwedstrijd in Antwerpen — {brand_name}
equipment:
  label: Mijn apparatuur
  title: Waar ik mee fotografeer.
  intro: Een vaste set die ik goed ken. De telelens gebruik ik voor de actie op het veld, de groothoek voor sfeer langs de lijn.
  items:
    - name: Canon EOS 40D
      description: Camera
    - name: Sigma 70-300mm
      description: Telelens — actie op afstand
    - name: Canon 28-90mm
      description: Standaardlens
    - name: Canon 18-55mm
      description: Groothoek — sfeer en overzicht
process:
  label: Mijn aanpak
  title: Hoe ik een wedstrijd aanpak.
  intro: "Tijdens iedere wedstrijd leg ik zoveel mogelijk relevante momenten vast: van snelle acties op het veld tot de sfeer langs de zijlijn. Daarna selecteer ik de sterkste beelden en lever ik een professioneel bewerkte reeks die past bij de gekozen opdracht."
  steps:
    - title: Voor de wedstrijd
      text: Ik spreek af waar en wanneer, en welke ploeg gefotografeerd wordt. De afspraken leggen we kort schriftelijk vast.
    - title: Langs de lijn
      text: Ik fotografeer de volledige wedstrijd en wissel tussen actie op het veld en sfeer langs de kant.
    - title: De selectie
      text: Na de wedstrijd bekijk ik alles en hou ik de beelden over die echt iets laten zien.
    - title: De bewerking
      text: Elke geselecteerde foto wordt afgewerkt, zodat de hele set er als één geheel uitziet.
cta:
  label: Boeken
  title: Laat je wedstrijd of speler vastleggen.
  text: Vul het formulier in en ik neem zo snel mogelijk contact op met een voorstel op maat.
  primary_label: Boek een shoot
  secondary_label: Bekijk het aanbod
  image:
    src: /assets/img/site/band-cta.webp
    alt: Twee spelers in duel om de bal tijdens een voetbalwedstrijd in Antwerpen — {brand_name}
